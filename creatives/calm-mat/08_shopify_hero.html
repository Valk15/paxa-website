<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAXA Calm Mat 08 — Shopify Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0A0A0A;--bone:#F5F5F0;--warm:#E8E0D5;
  --sage:#4A6741;--sage-light:#EAF3DE;--sage-mid:#9FBF93;
  --stone:#B8A898;--muted:#6B6860;
}
html,body{width:1200px;height:628px;overflow:hidden}
body{
  background:var(--ink);
  display:flex;
  position:relative;
}
.left{
  flex:0 0 55%;
  display:flex;flex-direction:column;justify-content:center;
  padding:60px 72px 60px 80px;
}
.right{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.right::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(91,188,214,.12) 0%,transparent 70%);
}
.sage-label{
  font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--sage);margin-bottom:20px;
}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:52px;line-height:1.15;color:var(--bone);
  letter-spacing:-1px;margin-bottom:20px;
}
.sub{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:15px;color:var(--stone);letter-spacing:.3px;
  margin-bottom:36px;line-height:1.6;
}
.cta{
  display:inline-block;
  padding:14px 28px;
  background:var(--bone);
  font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:13px;letter-spacing:.5px;color:var(--ink);
}
.mat-wrap{
  width:380px;height:380px;
  position:relative;z-index:1;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.55));
  transform:rotate(8deg);
}
</style>
</head>
<body>
<div class="left">
  <div class="sage-label">PAXA Calm Mat</div>
  <h1>The tool your dog's nervous system needs</h1>
  <div class="sub">Food-grade silicone · Bundle of 2 · Free UK delivery</div>
  <div class="cta">Get the Calm Mat — £34 →</div>
</div>
<div class="right">
  <div class="mat-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
      <defs>
        <pattern id="a08" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="6" fill="#8DDAF5" opacity=".55"/></pattern>
        <pattern id="b08" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M0 7.5Q3.75 0 7.5 7.5Q11.25 15 15 7.5" fill="none" stroke="#8DDAF5" stroke-width="2.5" opacity=".55"/></pattern>
        <pattern id="c08" width="28" height="18" patternUnits="userSpaceOnUse"><polyline points="0,9 14,2 28,9" fill="none" stroke="#8DDAF5" stroke-width="2.5" opacity=".55"/><polyline points="0,16 14,9 28,16" fill="none" stroke="#8DDAF5" stroke-width="2.5" opacity=".55"/></pattern>
        <pattern id="d08" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="6" y="0" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/><rect x="0" y="6" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/><rect x="12" y="6" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/><rect x="6" y="12" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/></pattern>
        <clipPath id="cl08"><rect x="20" y="20" width="360" height="360" rx="18"/></clipPath>
      </defs>
      <rect x="20" y="20" width="360" height="360" rx="18" fill="#5BBCD6"/>
      <g clip-path="url(#cl08)">
        <rect x="20" y="20" width="174" height="174" fill="url(#a08)"/>
        <rect x="206" y="20" width="174" height="174" fill="url(#b08)"/>
        <rect x="20" y="206" width="174" height="174" fill="url(#c08)"/>
        <rect x="206" y="206" width="174" height="174" fill="url(#d08)"/>
        <rect x="20" y="190" width="360" height="20" rx="5" fill="#3A9EBE"/>
        <rect x="190" y="20" width="20" height="360" rx="5" fill="#3A9EBE"/>
        <rect x="190" y="190" width="20" height="20" rx="0" fill="#2D88A2"/>
        <rect x="20" y="20" width="360" height="70" fill="rgba(255,255,255,.08)"/>
      </g>
      <rect x="20" y="20" width="360" height="360" rx="18" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2.5"/>
    </svg>
  </div>
</div>
</body>
</html>
