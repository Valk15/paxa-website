<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAXA Calm Mat 06 — Story Hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0A0A0A;--bone:#F5F5F0;--warm:#E8E0D5;
  --sage:#4A6741;--sage-light:#EAF3DE;--sage-mid:#9FBF93;
  --stone:#B8A898;--muted:#6B6860;
}
html,body{width:1080px;height:1920px;overflow:hidden}
body{
  background:var(--ink);
  display:flex;flex-direction:column;
  position:relative;
}
.hero-zone{
  flex:0 0 55%;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:100px 96px 60px;
}
.top-label{
  font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:11px;letter-spacing:3.5px;text-transform:uppercase;
  color:var(--sage);margin-bottom:40px;
}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:88px;line-height:1.1;color:var(--bone);
  letter-spacing:-2px;margin-bottom:36px;
}
.italic-line{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-weight:300;font-size:52px;line-height:1.2;
  color:var(--sage-mid);letter-spacing:-.8px;
}
.divider{
  width:56px;height:1px;background:var(--sage);
  opacity:.6;margin:48px 0;
}
.lower-band{
  flex:1;background:var(--bone);
  padding:72px 96px 80px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.body-copy{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:26px;line-height:1.75;color:var(--ink);
}
.bottom-label{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--stone);
}
</style>
</head>
<body>
<div class="hero-zone">
  <div class="top-label">Separation Anxiety</div>
  <h1>Stop trying to calm your dog before you leave.</h1>
  <div class="italic-line">That's not how the nervous system works.</div>
  <div class="divider"></div>
</div>
<div class="lower-band">
  <p class="body-copy">Licking activates the parasympathetic system. It releases serotonin. It counters cortisol. Give your dog a tool — not a command.</p>
  <div class="bottom-label">PAXA Calm Mat · paxapet.co.uk</div>
</div>
</body>
</html>
