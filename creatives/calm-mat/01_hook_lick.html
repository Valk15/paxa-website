<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAXA Calm Mat 01 — Hook: Lick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0A0A0A;--bone:#F5F5F0;--warm:#E8E0D5;
  --sage:#4A6741;--sage-light:#EAF3DE;--sage-mid:#9FBF93;
  --stone:#B8A898;--muted:#6B6860;
}
html,body{width:1080px;height:1080px;overflow:hidden}
body{
  background:var(--ink);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
}
.wrap{text-align:center;padding:0 108px;max-width:1080px}
h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;font-size:80px;line-height:1.13;
  color:var(--bone);letter-spacing:-1.5px;
  margin-bottom:44px;
}
.rule{
  width:54px;height:1px;
  background:var(--sage);
  margin:0 auto 44px;
  opacity:.7;
}
.italic{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;font-style:italic;
  font-size:74px;color:var(--sage);
  letter-spacing:-1.5px;
}
.bottom-label{
  position:absolute;bottom:58px;left:50%;transform:translateX(-50%);
  font-family:'DM Sans',sans-serif;font-weight:300;font-size:13px;
  letter-spacing:4px;color:var(--stone);
  text-transform:uppercase;white-space:nowrap;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Your dog doesn't need to calm down when you leave.</h1>
  <div class="rule"></div>
  <div class="italic">They need to lick.</div>
</div>
<span class="bottom-label">PAXA · The science of calm</span>
</body>
</html>
