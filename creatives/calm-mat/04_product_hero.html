<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAXA Calm Mat 04 — Product Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0A0A0A;--bone:#F5F5F0;--warm:#E8E0D5;
  --sage:#4A6741;--sage-light:#EAF3DE;--sage-mid:#9FBF93;
  --stone:#B8A898;--muted:#6B6860;
}
html,body{width:1080px;height:1080px;overflow:hidden}
body{
  background:var(--ink);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;gap:0;
}
.intro-label{
  font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:11px;letter-spacing:3.5px;text-transform:uppercase;
  color:var(--sage);margin-bottom:14px;text-align:center;
}
h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:74px;color:var(--bone);text-align:center;
  letter-spacing:-1.5px;line-height:1;margin-bottom:8px;
}
.italic-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-weight:300;font-size:28px;color:var(--stone);
  text-align:center;margin-bottom:36px;
}
.mat-wrap{
  width:440px;height:440px;
  transform:rotate(-4deg);
  filter:drop-shadow(0 24px 48px rgba(0,0,0,.55));
  margin-bottom:36px;
}
.bottom-specs{
  display:flex;align-items:center;gap:28px;
  justify-content:center;
}
.price{
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:46px;color:var(--bone);
}
.divider-v{width:1px;height:28px;background:var(--muted);opacity:.5}
.spec-note{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:14px;color:var(--stone);letter-spacing:.4px;
}
</style>
</head>
<body>
<div class="intro-label">Introducing</div>
<h1>PAXA Calm Mat</h1>
<div class="italic-sub">The 40-minute window tool</div>
<div class="mat-wrap">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <defs>
      <filter id="s04"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter>
      <pattern id="a04" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="6" fill="#8DDAF5" opacity=".55"/></pattern>
      <pattern id="b04" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M0 7.5Q3.75 0 7.5 7.5Q11.25 15 15 7.5" fill="none" stroke="#8DDAF5" stroke-width="2.5" opacity=".55"/></pattern>
      <pattern id="c04" width="28" height="18" patternUnits="userSpaceOnUse"><polyline points="0,9 14,2 28,9" fill="none" stroke="#8DDAF5" stroke-width="2.5" opacity=".55"/><polyline points="0,16 14,9 28,16" fill="none" stroke="#8DDAF5" stroke-width="2.5" opacity=".55"/></pattern>
      <pattern id="d04" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="6" y="0" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/><rect x="0" y="6" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/><rect x="12" y="6" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/><rect x="6" y="12" width="8" height="8" rx="1.5" fill="#8DDAF5" opacity=".42"/></pattern>
      <clipPath id="cl04"><rect x="20" y="20" width="360" height="360" rx="18"/></clipPath>
    </defs>
    <rect x="20" y="20" width="360" height="360" rx="18" fill="#5BBCD6"/>
    <g clip-path="url(#cl04)">
      <rect x="20" y="20" width="174" height="174" fill="url(#a04)"/>
      <rect x="206" y="20" width="174" height="174" fill="url(#b04)"/>
      <rect x="20" y="206" width="174" height="174" fill="url(#c04)"/>
      <rect x="206" y="206" width="174" height="174" fill="url(#d04)"/>
      <rect x="20" y="190" width="360" height="20" rx="5" fill="#3A9EBE"/>
      <rect x="190" y="20" width="20" height="360" rx="5" fill="#3A9EBE"/>
      <rect x="190" y="190" width="20" height="20" rx="0" fill="#2D88A2"/>
      <rect x="20" y="20" width="360" height="70" fill="rgba(255,255,255,.08)"/>
    </g>
    <rect x="20" y="20" width="360" height="360" rx="18" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2.5"/>
  </svg>
</div>
<div class="bottom-specs">
  <span class="price">£34</span>
  <div class="divider-v"></div>
  <span class="spec-note">Bundle of 2 · Food-grade silicone · 99 suction cups</span>
</div>
</body>
</html>
