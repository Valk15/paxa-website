<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAXA Calm Mat 02 — Cortisol Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0A0A0A;--bone:#F5F5F0;--warm:#E8E0D5;
  --sage:#4A6741;--sage-light:#EAF3DE;--sage-mid:#9FBF93;
  --stone:#B8A898;--muted:#6B6860;
}
html,body{width:1080px;height:1080px;overflow:hidden}
body{
  background:var(--bone);
  position:relative;
  display:flex;align-items:center;
  padding:90px 104px;
}
.col{display:flex;flex-direction:column}
.top-label{
  font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--sage);margin-bottom:20px;
}
.big-num{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:296px;line-height:.82;color:var(--ink);
  letter-spacing:-14px;margin-left:-6px;
}
.subline{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:23px;color:var(--ink);letter-spacing:-.2px;
  margin-top:18px;margin-bottom:48px;
}
.divider{width:44px;height:2px;background:var(--sage);margin-bottom:36px}
.body-copy{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:19px;line-height:1.78;color:var(--muted);
  max-width:680px;
}
.bottom-label{
  position:absolute;bottom:72px;right:104px;
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:17px;color:var(--stone);letter-spacing:.8px;
  font-style:italic;
}
</style>
</head>
<body>
<div class="col">
  <span class="top-label">Behavioural Science</span>
  <div class="big-num">40</div>
  <div class="subline">minutes — when cortisol peaks after you leave</div>
  <div class="divider"></div>
  <p class="body-copy">This is the window your dog needs support. Not commands. Not treats. A parasympathetic activation tool.</p>
</div>
<span class="bottom-label">PAXA Calm Mat</span>
</body>
</html>
